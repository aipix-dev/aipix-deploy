---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app.kubernetes.io/instance: traefik-traefik-v2
    app.kubernetes.io/name: traefik
  namespace: vsaas-vms
  name: internal-player
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host (`vms.example.com`) && PathPrefix(`/player/embeded`)
      middlewares:
      - name: strip-prefix-internal-player
      services:
        - kind: Service
          name: internal-player
          port: 80