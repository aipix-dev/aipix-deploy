- op: add
  path: /spec/template/spec/volumes
  value:
    - name: ble-service-license
      configMap:
        name: ble-service-license
- op: add
  path: /spec/template/spec/containers/0/volumeMounts
  value:
    - name: ble-service-license
      mountPath: /app/license.jwt
      subPath: license.jwt
      readOnly: true